name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            asset: zimika-linux-x86_64
            binary: zig-out/release/bin/zimika
            target_flag: ""
          - name: macos-aarch64
            os: macos-14
            asset: zimika-macos-x86_64
            binary: zig-out/release/bin/zimika
            target_flag: -Dtarget=x86_64-macos
          - name: windows-x86_64
            os: windows-latest
            asset: zimika-windows-x86_64.exe
            binary: zig-out/release/bin/zimika.exe
            target_flag: ""

    steps:
      - name: Checkout Zimika
        uses: actions/checkout@v5

      - name: Fetch MyZig
        shell: bash
        run: |
          git init ../myzig
          git -C ../myzig remote add origin https://github.com/agnogad/myzig.git
          git -C ../myzig fetch --depth 1 origin 245791984a1f3d5510053920547ccdb344eca63f
          git -C ../myzig checkout FETCH_HEAD

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libx11-dev

      - name: Unit tests
        if: runner.os == 'Linux'
        run: zig build test --summary all

      - name: Build release binary
        shell: bash
        run: zig build install ${{ matrix.target_flag }} -Doptimize=ReleaseSafe --prefix zig-out/release --summary all

      - name: Rename asset
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show assets
        run: ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
