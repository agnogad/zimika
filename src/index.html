<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zimika — Music</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3 1-3 14-2-1z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S4 14 4 9a4 4 0 0 1 8-2 4 4 0 0 1 8 2c0 5-8 11-8 11z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M20 5 9 12l11 7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M4 5l11 7L4 19z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 6h4l8 12h4M4 18h4l3-4m5-4 3-4h4M16 4l4 2-4 2m0 8 4 2-4 2"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 9V7a3 3 0 0 1 3-3h11m0 0-3-3m3 3-3 3M20 15v2a3 3 0 0 1-3 3H6m0 0 3 3m-3-3 3-3"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h13M4 12h13M4 18h9M18 8v10m0 0 3-3m-3 3-3-3"/></symbol>
  <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5 4h14v16l-7-4-7 4z"/><path d="M8 9h8M8 13h5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M6 16v4m6-8v8m6-12v12"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
</svg>

<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">Z</span><span class="brand-name">Zimika</span></div>
    <span class="grow"></span>
    <span id="status" class="status mono">starting</span>
    <button id="themeBtn" class="icon-btn" title="Theme"><svg class="ico"><use href="#i-moon"/></svg></button>
    <button id="zoomBtn" class="icon-btn" title="Zoom">100%</button>
    <button id="settingsBtn" class="icon-btn" title="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
  </header>

  <div class="body">
    <aside class="sidebar">
      <nav id="nav" class="nav"></nav>
      <div class="side-sep"></div>
      <div class="side-title"><span>Playlists</span><button id="newPlaylistBtn" class="icon-btn tiny" title="New playlist"><svg class="ico"><use href="#i-plus"/></svg></button></div>
      <nav id="playlistsNav" class="nav"></nav>
      <div class="grow"></div>
      <div class="side-foot mono" id="sideFoot">—</div>
    </aside>

    <main class="content">
      <div class="content-head">
        <button id="backBtn" class="icon-btn" title="Back">‹</button>
        <h1 id="pageTitle">Home</h1>
        <span class="grow"></span>
        <input id="searchInput" class="search" type="search" placeholder="Search music" aria-label="Search">
      </div>
      <div id="filters" class="filters" hidden></div>
      <div id="page" class="page"></div>
    </main>
  </div>

  <footer class="playerbar">
    <div class="track">
      <div id="art" class="art"><svg class="ico"><use href="#i-mic"/></svg></div>
      <div class="track-meta"><div id="trackTitle" class="track-title">Nothing playing</div><div id="trackArtist" class="track-artist">—</div></div>
      <button id="likeBtn" class="icon-btn tiny" title="Like"><svg class="ico"><use href="#i-heart"/></svg></button>
    </div>
    <div class="transport">
      <div class="transport-buttons">
        <button id="shuffleBtn" class="icon-btn tiny" title="Shuffle"><svg class="ico"><use href="#i-shuffle"/></svg></button>
        <button id="prevBtn" class="icon-btn" title="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
        <button id="playBtn" class="icon-btn play" title="Play"><svg class="ico"><use href="#i-play"/></svg></button>
        <button id="nextBtn" class="icon-btn" title="Next"><svg class="ico"><use href="#i-next"/></svg></button>
        <button id="repeatBtn" class="icon-btn tiny" title="Repeat"><svg class="ico"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek"><span id="curTime" class="mono">0:00</span><input id="seekInput" type="range" min="0" max="1000" value="0"><span id="durTime" class="mono">0:00</span></div>
    </div>
    <div class="player-right">
      <button id="queueBtn" class="icon-btn tiny" title="Queue"><svg class="ico"><use href="#i-queue"/></svg></button>
      <button id="lyricsBtn" class="icon-btn tiny" title="Lyrics"><svg class="ico"><use href="#i-lyrics"/></svg></button>
      <button id="statsBtn" class="icon-btn tiny" title="Stats"><svg class="ico"><use href="#i-chart"/></svg></button>
      <svg class="ico vol-ico"><use href="#i-volume"/></svg>
      <input id="volInput" type="range" min="0" max="100" value="80" title="Volume">
    </div>
  </footer>
</div>

<aside id="fullPlayer" class="full-player" hidden>
  <div class="fp-head"><button id="fpClose" class="icon-btn">×</button><span id="fpTitle">Now playing</span></div>
  <div class="fp-body">
    <div id="fpArt" class="fp-art"></div>
    <div class="fp-panels">
      <div class="tabs"><button data-tab="queue" class="active">Queue</button><button data-tab="lyrics">Lyrics</button><button data-tab="related">Related</button></div>
      <div id="fpPanel" class="fp-panel"></div>
    </div>
  </div>
</aside>

<div id="menu" class="popup" hidden></div>
<div id="modal" class="modal-root" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
